server:
  forward-headers-strategy: framework

spring:
  application:
    name: portfolio-backend

  graphql:
    graphiql:
      enabled: true
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,OPTIONS

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    recipient: ${MAIL_RECIPIENT:${spring.mail.username:}}

github:
  username: ${GITHUB_USERNAME:cs1m2414238}
  token: ${GITHUB_PAT:${GITHUB_TOKEN:}}